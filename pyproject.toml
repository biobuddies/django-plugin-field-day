[build-system]
backend-path = ['']
build-backend = 'pypi_compatible_build'
requires = ['setuptools>=61.0', 'setuptools_scm[toml]>=6.2', 'wheel']

[project]
classifiers = [
    'Programming Language :: Python :: 3.12',
    'Operating System :: OS Independent',
    'Framework :: Django',
]
description = 'New and improved fields for Django'
license = 'BSD-3-Clause'
name = 'django-plugin-field-day'
readme = 'README.md'
requires-python = '>=3.12'
dynamic = ['version']

dependencies = [
    'django',
    'djp',
]

[project.optional-dependencies]
build = ['build', 'twine']
interact = ['django-plugin-extensions']
pre-commit = [
    'actionlint-py',
    'basedpyright',
    'cookiecutter',
    'django-stubs>=6.0.4',
    'django-upgrade',
    'djlint',
    'hadolint-py @ git+https://github.com/AleksaC/hadolint-py.git',
    'pre-commit-hooks',
    'pyrefly',
    'ruff',
    'setuptools',
    'shellcheck-py',
    'shfmt-py',
    'typos',
    'validate-pyproject[all]',
    'yamllint',
]
test = [
    'django-plugin-database-url',
    'pytest',
    'pytest-cov',
    'pytest-django',
]

[project.entry-points.djp]
django_plugin_field_day = 'django_plugin_field_day'

[project.urls]
source = 'https://github.com/biobuddies/django-plugin-field-day'

[tool.setuptools]
packages = ['django_plugin_field_day', 'django_plugin_field_day.migrations']

[tool.setuptools_scm]

[tool.basedpyright]
extends = '.biobuddies/basedpyright.toml'
# Final on a migration's dependencies/operations is a legitimate non-final to Final specialization
reportIncompatibleVariableOverride = false

[tool.ruff]
extend = '.biobuddies/ruff.toml'

# Django generates migrations without module docstrings, and RunPython leaves schema_editor
# unused. Final annotations satisfy RUF012 on dependencies and operations.
[tool.ruff.lint.extend-per-file-ignores]
'**/migrations/*.py' = ['ARG001', 'D100']

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

# Final specializes a migration's inherited ClassVar dependencies/operations, which is deliberate
[tool.pyrefly.errors]
bad-override = false
